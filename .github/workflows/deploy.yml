name: Deploy Backend to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            APP_DIR="$HOME/pine"
            cd "$APP_DIR/backend"

            echo "▸ Resetting local changes..."
            git checkout -- .
            git clean -fd

            echo "▸ Pulling latest backend..."
            git pull origin main

            echo "▸ Rebuilding and restarting backend container..."
            cd "$APP_DIR"
            sudo docker compose up -d --build backend

            echo "▸ Waiting for backend to be healthy..."
            sleep 5

            echo "▸ Health check..."
            # Backend is only reachable inside Docker network (no exposed ports).
            # Check container is running and not restart-looping.
            RUNNING=$(sudo docker inspect -f '{{.State.Running}}' pine-backend 2>/dev/null || echo "false")
            RESTARTS=$(sudo docker inspect -f '{{.RestartCount}}' pine-backend 2>/dev/null || echo "99")
            if [ "$RUNNING" = "true" ] && [ "$RESTARTS" -lt 3 ]; then
              echo "✓ Backend deployed successfully (container running, restarts: $RESTARTS)"
            else
              echo "⚠ Backend not healthy (running=$RUNNING, restarts=$RESTARTS)"
              echo "--- Recent logs ---"
              sudo docker compose logs --tail=20 backend
              exit 1
            fi
