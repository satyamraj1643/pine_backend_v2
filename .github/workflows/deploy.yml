name: Deploy Backend to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            APP_DIR="$HOME/pine"
            cd "$APP_DIR/backend"

            echo "▸ Resetting local changes..."
            git checkout -- .
            git clean -fd

            echo "▸ Pulling latest backend..."
            git pull origin main

            echo "▸ Rebuilding and restarting backend container..."
            cd "$APP_DIR"
            sudo docker compose up -d --build backend

            echo "▸ Waiting for backend to be healthy..."
            sleep 5

            echo "▸ Health check..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/auth/validate 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "401" ]; then
              echo "✓ Backend deployed successfully (HTTP $HTTP_CODE — expected)"
            else
              echo "⚠ Backend returned HTTP $HTTP_CODE — check logs with: sudo docker compose logs backend"
              exit 1
            fi
