name: Deploy Backend to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ENV_CONTENT
          script: |
            set -e
            APP_DIR="$HOME/pine"
            
            # If repo is inside $HOME/pine/backend or $HOME/pine directly
            if [ -d "$APP_DIR/backend/.git" ]; then
              TARGET_DIR="$APP_DIR/backend"
            else
              TARGET_DIR="$APP_DIR"
            fi

            cd "$TARGET_DIR"

            echo "▸ Resetting local changes..."
            git checkout -- . || true
            git clean -fd || true

            echo "▸ Pulling latest code from main..."
            git pull origin main

            if [ -n "$ENV_CONTENT" ]; then
              echo "▸ Updating .env file from GitHub Secrets..."
              printf '%s\n' "$ENV_CONTENT" > .env
            fi

            echo "▸ Rebuilding and restarting containers..."
            sudo docker compose up -d --build

            echo "▸ Waiting for backend container..."
            sleep 5

            echo "▸ Health check..."
            RUNNING=$(sudo docker inspect -f '{{.State.Running}}' pine-backend 2>/dev/null || echo "false")
            RESTARTS=$(sudo docker inspect -f '{{.RestartCount}}' pine-backend 2>/dev/null || echo "99")
            if [ "$RUNNING" = "true" ] && [ "$RESTARTS" -lt 5 ]; then
              echo "✓ Backend deployed successfully (container running, restarts: $RESTARTS)"
            else
              echo "⚠ Backend not healthy (running=$RUNNING, restarts=$RESTARTS)"
              echo "--- Recent logs ---"
              sudo docker compose logs --tail=30
              exit 1
            fi
